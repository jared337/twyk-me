<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creators | twyk.me</title>
  <meta name="description" content="Meet the creators on twyk.me. Browse makers by followers, models, downloads and remixes, and see everything each one has published." />
  <link rel="canonical" href="https://twyk.me/creators.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="twyk.me" />
  <meta property="og:title" content="Creators | twyk.me" />
  <meta property="og:description" content="Meet the creators on twyk.me. Browse makers by followers, models, downloads and remixes, and see everything each one has published." />
  <meta property="og:url" content="https://twyk.me/creators.html" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Creators | twyk.me" />
  <meta name="twitter:description" content="Meet the creators on twyk.me. Browse makers by followers, models, downloads and remixes, and see everything each one has published." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://twyk.me/"}, {"@type": "ListItem", "position": 2, "name": "Creators", "item": "https://twyk.me/creators.html"}]}</script>
</head>
<body>

  <section class="explore-head">
    <div class="container">
      <h1>Creators</h1>
      <p>The makers behind the models. Follow the ones whose work you want more of.</p>
      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input type="search" id="search" placeholder="Search creators by name, bio or model&hellip;" />
        </div>
        <select class="sort" id="sort">
          <option value="followers">Most followers</option>
          <option value="models">Most models</option>
          <option value="downloads">Most downloads</option>
          <option value="remixes">Most remixed</option>
        </select>
      </div>
    </div>
  </section>

  <section style="padding-bottom: 80px;">
    <div class="container">
      <div class="creator-grid" id="grid"></div>
      <div class="empty-state" id="empty" hidden>
        <h3>No creators match</h3>
        <p>Try a different search.</p>
      </div>
    </div>
  </section>

  <script type="module">
    import { renderHeader, renderFooter, avatarHTML, observeReveals, MODELS, USERS, fmt } from "./js/app.js";

    renderHeader();
    renderFooter();

    const creators = Object.values(USERS).map(u => {
      const models = MODELS.filter(m => m.author === u.id);
      return {
        ...u,
        modelList: models,
        modelCount: models.length,
        downloads: models.reduce((s, m) => s + m.downloads, 0),
        remixes: models.reduce((s, m) => s + m.remixes, 0),
      };
    });

    let query = "";
    let sortKey = "followers";

    function cardHTML(c) {
      return `
        <div class="creator-card reveal">
          <a class="cc-head" href="profile.html?u=${c.id}">
            ${avatarHTML(c.id, 52)}
            <span class="who">
              <b>${c.name}</b>
              <span>${fmt(c.followers)} followers &middot; ${c.modelCount} models</span>
            </span>
          </a>
          <p class="cc-bio">${c.bio}</p>
          <div class="cc-models">
            ${c.modelList.map(m => `
              <a href="model.html?id=${m.id}" title="${m.name}">
                <span class="mini-thumb" data-kind="${m.kind}" style="background: linear-gradient(135deg, ${m.gradient[0]}22, ${m.gradient[1]}33);"></span>
              </a>`).join("")}
          </div>
          <div class="cc-stats">
            <span><b>${fmt(c.downloads)}</b> downloads</span>
            <span><b>${fmt(c.remixes)}</b> remixes of their work</span>
            <a href="profile.html?u=${c.id}" style="margin-left:auto; font-weight:600;">View profile <span class="arrow">&rsaquo;</span></a>
          </div>
        </div>`;
    }

    function apply() {
      let list = [...creators];
      if (query) {
        const q = query.toLowerCase();
        list = list.filter(c =>
          c.name.toLowerCase().includes(q) ||
          c.bio.toLowerCase().includes(q) ||
          c.modelList.some(m => m.name.toLowerCase().includes(q) || m.tags.some(t => t.includes(q)))
        );
      }
      list.sort((a, b) => b[sortKey === "models" ? "modelCount" : sortKey] - a[sortKey === "models" ? "modelCount" : sortKey]);
      document.getElementById("empty").hidden = list.length > 0;
      document.getElementById("grid").innerHTML = list.map(cardHTML).join("");
      observeReveals();
      import("./js/thumbs.js").then(t => t.upgradeThumbs()).catch(() => {});
    }

    document.getElementById("search").addEventListener("input", e => { query = e.target.value; apply(); });
    document.getElementById("sort").addEventListener("change", e => { sortKey = e.target.value; apply(); });

    apply();
  </script>
</body>
</html>
