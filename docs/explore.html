<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore | twyk.me</title>
  <meta name="description" content="Browse free 3D printable models on twyk.me. Every model opens in the browser editor, ready to remix, download as STL or 3MF, and print." />
  <link rel="canonical" href="https://twyk.me/explore.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="twyk.me" />
  <meta property="og:title" content="Explore | twyk.me" />
  <meta property="og:description" content="Browse free 3D printable models on twyk.me. Every model opens in the browser editor, ready to remix, download as STL or 3MF, and print." />
  <meta property="og:url" content="https://twyk.me/explore.html" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Explore | twyk.me" />
  <meta name="twitter:description" content="Browse free 3D printable models on twyk.me. Every model opens in the browser editor, ready to remix, download as STL or 3MF, and print." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://twyk.me/"}, {"@type": "ListItem", "position": 2, "name": "Explore", "item": "https://twyk.me/explore.html"}]}</script>
</head>
<body>

  <section class="explore-head">
    <div class="container">
      <h1>Explore models</h1>
      <p>Every model opens in the editor. Find something close, remix the rest.</p>
      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input type="search" id="search" placeholder="Search models, tags, creators&hellip;" />
        </div>
        <select class="sort" id="sort">
          <option value="likes">Most liked</option>
          <option value="downloads">Most downloaded</option>
          <option value="remixes">Most remixed</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section style="padding-bottom: 80px;">
    <div class="container">
      <div class="model-grid" id="grid"></div>
      <div class="empty-state" id="empty" hidden>
        <h3>No models match</h3>
        <p>Try a different search, or be the first to publish one.</p>
      </div>
    </div>
  </section>

  <script type="module">
    import { renderHeader, renderFooter, renderCards, MODELS, USERS } from "./js/app.js";
    import { CATEGORIES } from "./js/data.js";

    renderHeader("explore");
    renderFooter();

    const params = new URLSearchParams(location.search);
    let cat = params.get("cat") || "all";
    let query = params.get("q") || "";
    let sortKey = "likes";
    document.getElementById("search").value = query;

    const chipsEl = document.getElementById("chips");
    chipsEl.innerHTML = CATEGORIES.map(c =>
      `<button class="chip ${c.id === cat ? "active" : ""}" data-cat="${c.id}">${c.label}</button>`
    ).join("");

    function apply() {
      let list = MODELS.filter(m => cat === "all" || m.category === cat);
      if (query) {
        const q = query.toLowerCase();
        list = list.filter(m =>
          m.name.toLowerCase().includes(q) ||
          m.tags.some(t => t.includes(q)) ||
          USERS[m.author].name.toLowerCase().includes(q)
        );
      }
      list.sort((a, b) => b[sortKey] - a[sortKey]);
      document.getElementById("empty").hidden = list.length > 0;
      renderCards(document.getElementById("grid"), list);
    }

    chipsEl.addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      cat = btn.dataset.cat;
      chipsEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === btn));
      apply();
    });
    document.getElementById("search").addEventListener("input", e => { query = e.target.value; apply(); });
    document.getElementById("sort").addEventListener("change", e => { sortKey = e.target.value; apply(); });

    apply();
  </script>
</body>
</html>
